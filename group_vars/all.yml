# Global group vars applied to all hosts and roles
# Place mappings used across roles here to avoid duplication.

# Map hostnames to datacenter names used in generated share names
# Add entries as needed for your environment
datacenter_map:
  av-pc: "GreaterNoida"
  WEB-01: "Mumbai-DC"
  DB-01: "Bengaluru-DC"
  TEST-VM: "TestLab"

# You can add other global mappings used by multiple roles here.
ansible_python_interpreter: /usr/bin/python

# Streamlit dashboard defaults (shared across hosts)
app_parent_dir: /home/devopsadmin/application
app_user: devopsadmin
venv_path: "{{ app_parent_dir }}/.venv"
service_name: streamlit-dashboard
streamlit_port: 8501
streamlit_address: 0.0.0.0
