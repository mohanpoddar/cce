---
# Ensure the host IP and hostname mapping exist in /etc/hosts
# Variables:
#  - host_ip: explicit IP to add (defaults to ansible_default_ipv4.address)
#  - host_name: explicit hostname to add (defaults to inventory_hostname)

- name: Ip Address passed from command line
  debug:
    msg: "IP Address passed from command line is {{ ip_address }}"

- name: Ensure host mapping is present in /etc/hosts (replace existing or append)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(\\S+)\\s+.*\\b{{ ansible_facts.hostname | regex_escape }}\\b.*$'
    line: "{{ ip_address }} {{ ansible_facts.hostname }}"
    create: yes
    state: present
    backup: yes
    insertafter: EOF
  become: true

- name: Ensure replication host alias is present in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ replication_host_alias | regex_escape }}$'
    line: "{{ ip_address }} {{ replication_host_alias }}"
    create: true
    state: present
    backup: true
    insertafter: EOF
  vars:
    replication_host_alias: "{{ 'prod-rsync' if deployment_environment == 'prod' else 'dr-rsync' }}"
  when:
    - deployment_environment in ['prod', 'dr']
    - ip_address is defined
    - ip_address | length > 0
  become: true

- name: Add commented replication peer instruction to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^#<[^>]+>\s+{{ peer_host_alias | regex_escape }}$'
    line: "#<{{ peer_ip_placeholder }}> {{ peer_host_alias }}"
    create: true
    state: present
    insertafter: EOF
  vars:
    peer_host_alias: "{{ 'dr-rsync' if deployment_environment == 'prod' else 'prod-rsync' }}"
    peer_ip_placeholder: "{{ 'dr_ip_address' if deployment_environment == 'prod' else 'prod_ip_address' }}"
  when:
    - deployment_environment in ['prod', 'dr']
    - ip_address is defined
    - ip_address | length > 0
  become: true
