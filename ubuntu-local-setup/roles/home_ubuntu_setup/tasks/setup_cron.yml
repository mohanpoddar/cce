---
- name: "Set target crontab user (default: cce)"
  set_fact:
    target_cron_user: "{{ orgusername | default('cce') }}"

- name: Validate replication environment
  ansible.builtin.assert:
    that:
      - environment is defined
      - environment in ['prod', 'dr']
      - ip_address is defined
      - ip_address | length > 0
    fail_msg: "Pass environment as prod or dr and provide ip_address"

- name: Set replication peer host from environment
  ansible.builtin.set_fact:
    peer_host: "{{ dr_peer_host if environment == 'prod' else prod_peer_host }}"

- name: Read existing crontab for target user
  ansible.builtin.shell:
    cmd: "crontab -l -u {{ target_cron_user }}"
  register: existing_cron
  failed_when: false
  changed_when: false

- name: Write existing crontab to temporary file
  ansible.builtin.copy:
    content: "{{ existing_cron.stdout | default('') }}\n"
    dest: "/tmp/{{ target_cron_user }}.crontab.current"
    mode: '0600'

- name: Copy new crontab template to temporary file
  ansible.builtin.copy:
    src: crontab
    dest: "/tmp/{{ target_cron_user }}.crontab"
    mode: '0600'
    owner: root
    group: root

- name: Update user crontab with the managed template
  ansible.builtin.shell: |
    set -o pipefail
    if ! diff -q /tmp/{{ target_cron_user }}.crontab /tmp/{{ target_cron_user }}.crontab.current >/dev/null 2>&1; then
      crontab -u {{ target_cron_user }} /tmp/{{ target_cron_user }}.crontab
      echo CHANGED
    else
      echo NOCHANGE
    fi
  args:
    executable: /bin/bash
  register: crontab_result
  changed_when: "'CHANGED' in crontab_result.stdout"

- name: Create system cron file for rsync replication
  ansible.builtin.template:
    src: cce_rsync_replication.j2
    dest: "/etc/cron.d/cce_rsync_replication"
    owner: root
    group: root
    mode: '0644'
  when: environment in ['prod', 'dr']

- name: Remove temporary crontab files
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - "{{ target_cron_user }}.crontab"
    - "{{ target_cron_user }}.crontab.current"
  when: crontab_result is defined

# Enable cron rsync for prod
- name: Copy production crontab to /etc/cron.d/crontab_rsync_prod
  ansible.builtin.copy:
    src: crontab_rsync_prod
    dest: /etc/cron.d/crontab_rsync_prod
    mode: '0644'
    owner: root
    group: root
  when:
    - environment == 'prod'

# Enable cron rsync for DR
- name: Copy DR crontab to /etc/cron.d/crontab_rsync_dr
  ansible.builtin.copy:
    src: crontab_rsync_dr
    dest: /etc/cron.d/crontab_rsync_dr
    mode: '0644'
    owner: root
    group: root
  when:
    - environment == 'dr'
