---
- name: "Set target crontab user (default: cce)"
  set_fact:
    target_cron_user: "{{ orgusername | default('cce') }}"

- name: Set current rsync replication config by target IP
  set_fact:
    current_rsync_config: "{{ rsync_replication_by_ip[ip_address] }}"
  when: ip_address is defined and ip_address | length > 0

- name: Fail when IP does not match any replication config
  ansible.builtin.fail:
    msg: "No rsync replication config found for IP {{ ip_address }}"
  when: ip_address is defined and ip_address | length > 0 and current_rsync_config is not defined

- name: Read existing crontab for target user
  ansible.builtin.shell:
    cmd: "crontab -l -u {{ target_cron_user }}"
  register: existing_cron
  failed_when: false
  changed_when: false

- name: Write existing crontab to temporary file
  ansible.builtin.copy:
    content: "{{ existing_cron.stdout | default('') }}\n"
    dest: "/tmp/{{ target_cron_user }}.crontab.current"
    mode: '0600'

- name: Copy new crontab template to temporary file
  ansible.builtin.copy:
    src: crontab
    dest: "/tmp/{{ target_cron_user }}.crontab"
    mode: '0600'
    owner: root
    group: root

- name: Update crontab with existing template if replication config is not defined
  ansible.builtin.shell: |
    set -o pipefail
    if ! diff -q /tmp/{{ target_cron_user }}.crontab /tmp/{{ target_cron_user }}.crontab.current >/dev/null 2>&1; then
      crontab -u {{ target_cron_user }} /tmp/{{ target_cron_user }}.crontab
      echo CHANGED
    else
      echo NOCHANGE
    fi
  args:
    executable: /bin/bash
  register: crontab_result
  changed_when: "'CHANGED' in crontab_result.stdout"
  when: current_rsync_config is not defined

- name: Create system cron file for rsync replication based on passed IP
  ansible.builtin.template:
    src: cce_rsync_replication.j2
    dest: "/etc/cron.d/cce_rsync_replication"
    owner: root
    group: root
    mode: '0644'
  when: rsync_replication_enabled | bool and current_rsync_config is defined

- name: Remove replication cron file when replication is disabled
  ansible.builtin.file:
    path: "/etc/cron.d/cce_rsync_replication"
    state: absent
  when: not (rsync_replication_enabled | bool)

- name: Remove temporary crontab files
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - "{{ target_cron_user }}.crontab"
    - "{{ target_cron_user }}.crontab.current"
  when: crontab_result is defined or current_rsync_config is defined
