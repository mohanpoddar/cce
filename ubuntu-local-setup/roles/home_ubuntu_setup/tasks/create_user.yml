---
- name: Add user.
  user:
    name: "{{ username }}"
    shell: /bin/bash
    groups: adm,cdrom,sudo,dip,plugdev,lpadmin,lxd
    password: "$6$z7ySCKJEMojTG4P9$dTcclU07ETfwoNNrYm8RjYb7ff0EBQjM7vqgraOFxiiA.yJTxSpI3Ld3.xXOoAPZvCi6DVrO.s9l3GjkWj3Kj0"
    append: yes
    generate_ssh_key: yes
    ssh_key_bits: 2048
    ssh_key_file: .ssh/id_rsa
  register: create_user
  # when: username is defined

- debug:
    var: script_dest_dir

- name: Assert required group variables are defined
  ansible.builtin.assert:
    that:
      - script_source_dir is defined
      - script_dest_dir is defined
    fail_msg: "Required variables script_source_dir or script_dest_dir are missing in group_vars/all.yml"
    success_msg: "script_source_dir and script_dest_dir are present"

# - name: sudo without password for devopsadmin user
- name: Define SMBD systemctl commands
  ansible.builtin.set_fact:
    smbd_systemctl_commands:
      - /usr/bin/systemctl unmask smbd
      - /usr/bin/systemctl mask smbd
      - /usr/bin/systemctl enable smbd
      - /usr/bin/systemctl disable smbd
      - /usr/bin/systemctl stop smbd
      - /usr/bin/systemctl start smbd
      - /usr/bin/systemctl status smbd

- name: Create sudoers file for user cce to manage smbd without password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/cce_smbd
    content: |
      Cmnd_Alias SMBD_CMDS = {{ smbd_systemctl_commands | join(', ') }}
      cce ALL=(ALL) NOPASSWD: SMBD_CMDS
    owner: root
    group: root
    mode: '0440'

- name: Create sudoers file for user cce to manage smbd without password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/cce_smbd
    content: |
      Cmnd_Alias SMBD_CMDS = {{ smbd_systemctl_commands | join(', ') }}
      devopsadmin ALL=(ALL) NOPASSWD: SMBD_CMDS
      devopsadmin ALL=(ALL) ALL
    owner: root
    group: root
    mode: '0440'

- name: Create sudoers file for user cce to manage smbd without password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/cce_smbd
    content: |
      Cmnd_Alias SMBD_CMDS = {{ smbd_systemctl_commands | join(', ') }}
      devopsadmin ALL=(ALL) NOPASSWD: SMBD_CMDS
    owner: root
    group: root
    mode: '0440'

- name: Create recursive directory for user cce
  ansible.builtin.file:
    path: "{{ script_dest_dir }}"
    state: directory
    owner: cce
    group: cce
    recurse: yes
    mode: 0755

- name: Copy file rsync_daily.sh to {{ script_dest_dir }}/rsync_daily.sh
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/rsync_daily.sh"
    dest: "{{ script_dest_dir }}/rsync_daily.sh"
    owner: cce
    group: cce
    mode: 0755

- name: Copy file rsync_daily_at_evening.sh to {{ script_dest_dir }}/rsync_daily_at_evening.sh
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/rsync_daily_at_evening.sh"
    dest: "{{ script_dest_dir }}/rsync_daily_at_evening.sh"
    owner: cce
    group: cce
    mode: 0755

# rsync_replication_daily
- name: Copy file rsync_replication_daily.sh to {{ script_dest_dir }}/rsync_replication_daily.sh
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/rsync_replication_daily.sh"
    dest: "{{ script_dest_dir }}/rsync_replication_daily.sh"
    owner: cce
    group: cce
    mode: 0755

- name: Copy cron files to {{ script_dest_dir }}
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/{{ item }}"
    dest: "{{ script_dest_dir }}/{{ item }}"
    owner: cce
    group: cce
    mode: 0755
  loop:
    - crontab_rsync_enable
    - crontab_rsync_disable


- name: Create system replication enabled cron file for rsync replication
  ansible.builtin.template:
    src: cce_rsync_replication_enabled.j2
    dest: "{{ script_dest_dir }}/cce_rsync_replication_enabled"
    owner: root
    group: root
    mode: '0644'

- name: Create system replication disabled cron file for rsync replication
  ansible.builtin.template:
    src: cce_rsync_replication_disabled.j2
    dest: "{{ script_dest_dir }}/cce_rsync_replication_disabled"
    owner: root
    group: root
    mode: '0644'


- name: Copy file monitoronedrive.sh to {{ script_dest_dir }}/monitoronedrive.sh
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/monitoronedrive.sh"
    dest: "{{ script_dest_dir }}/monitoronedrive.sh"
    owner: cce
    group: cce
    mode: 0655

# Copy cceplrsyncmail.py to {{ script_dest_dir }}/cceplrsyncmail.py
- name: Copy file cceplrsyncmail.py to {{ script_dest_dir }}/cceplrsyncmail.py
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/cceplrsyncmail.py"
    dest: "{{ script_dest_dir }}/cceplrsyncmail.py"
    owner: cce
    group: cce
    mode: 0655

- name: Ensure CCEPL email config directory exists
  ansible.builtin.file:
    path: "/etc/ccepl"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create environment file for email password from Ansible Vault
  ansible.builtin.template:
    src: ccepl_rsync_email.env.j2
    dest: "/etc/ccepl/rsync_email.env"
    owner: root
    group: root
    mode: '0600'
  when: email_password is defined and email_password | length > 0

- name: Copy file cceplrsyncmail_ransome.py to {{ script_dest_dir }}/cceplrsyncmail_ransome.py
  ansible.builtin.copy:
    src: "{{ script_source_dir }}/cceplrsyncmail_ransome.py"
    dest: "{{ script_dest_dir }}/cceplrsyncmail_ransome.py"
    owner: cce
    group: cce
    mode: 0655

# Create rsync log directory /home/cce/logs/rsync
- name: Create rsync log directory {{ rsync_log_dir }}
  ansible.builtin.file:
    path: "{{ rsync_log_dir }}"
    state: directory
    owner: cce
    group: cce
    mode: 0755

