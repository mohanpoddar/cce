---
# tasks file for samba

- name: Include OS-specific Variables.
  include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Inst - Update Repositories Cache
  apt:
    update_cache: true
  when:
    - ansible_facts['os_family'] == 'Debian'
  tags: samba-inst-package

- name: Verify directory for samba share mount point /opt/ccpldata exists. If not, create it.
  file:
    path: "{{ live_share_mount_points }}"
    state: directory
  tags: samba-inst-package

- name: Inst - Samba Packages
  package:
    name: "{{ samba_packages }}"
    state: "present"
  tags: samba-inst-package

# Backup samba configuration file (timestamped)
- name: Backup samba configuration file (timestamped)
  copy:
    src: "{{ samba_configuration }}"
    dest: "{{ samba_configuration }}.{{ ansible_facts['date_time'].date }}-{{ ansible_facts['date_time'].time }}"
    remote_src: true
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - samba-conf

# Configure Samba: set workgroup in the existing smb.conf and append share blocks
- name: Ensure Samba workgroup is set from role variable
  replace:
    path: "{{ samba_configuration }}"
    regexp: '(?i)^[ \t]*#?[ \t]*(workgroup|workgrpup)[ \t]*=.*$'
    replace: '   workgroup = {{ samba_workgroup }}'
    backup: yes
  tags:
    - samba-conf

- name: Ensure single Samba workgroup line exists under [global]
  lineinfile:
    path: "{{ samba_configuration }}"
    insertafter: '^\\[global\\]'
    line: '   workgroup = {{ samba_workgroup }}'
    regexp: '^\\s*workgroup\\s*=.*'
    backup: yes
  notify:
    - Restart Samba
  tags:
    - samba-conf

- name: Add Samba share configuration
  blockinfile:
    path: "{{ samba_configuration }}"
    block: "{{ lookup('template', 'smb_share.j2') }}"
    insertafter: EOF
  notify:
    - Restart Samba
  tags:
    - samba-conf

- name: Validate Samba configuration with testparm
  command:
    cmd: "testparm -s {{ samba_configuration }}"
  register: testparm_result
  changed_when: false
  failed_when: testparm_result.rc != 0
  tags:
    - samba-conf

# - name: Conf - Samba
#   template:
#     dest: "{{ samba_configuration }}"
#     src: smb.conf.j2
#     validate: 'testparm -s %s'
#   notify:
#     - Restart Samba
#   tags:
#     - samba-conf

- name: Create Samba user password
  shell: (echo {{ item.password }}; echo {{ item.password }}) | smbpasswd -s -a {{ item.name }}
  args:
    executable: /bin/bash
  with_items: "{{ samba_users }}"
  no_log: true

- name: Filter IP Address
  debug:
    var: ansible_facts['all_ipv4_addresses'][0]
    
- name: List Samba share
  shell: echo {{ item.password }} | smbclient -L {{ ansible_facts['all_ipv4_addresses'][0] }} -U {{ item.name }}
  with_items: "{{ samba_users }}"
  no_log: true
  register: list_share
  ignore_errors: true

- debug:
    var: list_share.results[0].stdout_lines

# Set fact for live_samba_server=true and variable value will be passed from command line when running the playbook. If not passed, default value will be false. This is used to determine if the samba server is live or not. If live, then stop and disable the samba services.
- name: Set fact for live_samba_server
  set_fact:
    live_samba_server_status : "{{ live_samba_server_status  | default(false) }}"

- name: Display live_samba_server_status
  debug:
    var: live_samba_server_status

- name: Display samba service status - pre
  shell: systemctl is-active {{ item }}
  loop:
    - smbd
    - nmbd
  register: samba_service_status_pre
  ignore_errors: true

- name: Display samba service status
  debug:
    var: samba_service_status_pre.results[0].stdout_lines

# Unmask, enable and start Samba services if live_samba_server_status is true.
- block:
    - name: Unmask Samba services to allow starting
      systemd:
        name: "{{ item }}"
        masked: no
      loop:
        - smbd
        - nmbd

    - name: Enable Samba services to start on boot
      service:
        name: "{{ item }}"
        enabled: true
      loop:
        - smbd
        - nmbd

    - name: Start Samba services
      service:
        name: "{{ item }}"
        state: started
      loop:
        - smbd
        - nmbd

    - name: List Samba share
      shell: echo {{ item.password }} | smbclient -L {{ ansible_facts['all_ipv4_addresses'][0] }} -U {{ item.name }}
      with_items: "{{ samba_users }}"
      no_log: true
      register: list_share_01
      ignore_errors: true

    - debug:
        var: list_share_01.results[0].stdout_lines
  when: live_samba_server_status == "true"

# Mask, disable and stop Samba services if live_samba_server_status is false.
- block:
    - name: Stop Samba services
      service:
        name: "{{ item }}"
        state: stopped
      loop:
        - smbd
        - nmbd

    - name: Disable Samba services from starting on boot
      service:
        name: "{{ item }}"
        enabled: false
      loop:
        - smbd
        - nmbd

    - name: Mask Samba services to prevent any manual starting
      systemd:
        name: "{{ item }}"
        masked: yes
      loop:
        - smbd
        - nmbd
  when: live_samba_server_status == "false"

- name: Display samba service status - post
  shell: systemctl is-active {{ item }}
  loop:
    - smbd
    - nmbd
  register: samba_service_status_post
  ignore_errors: true

- name: Display samba service status
  debug:
    var: samba_service_status_post.results[0].stdout_lines